<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-I Play-Type Dashboard</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f5f3; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#7d7c76; --accent:#2a78d6;
  --b-sc:#2a78d6; --b-roll:#eb6834; --b-cut:#1baf7a; --b-shoot:#eda100; --b-post:#e87ba4;
  --b-trans:#a8a7a0; --b-put:#7d7c76; --b-other:#d6d5cf;
  --pos:42,120,214; --neg:227,73,72; --seq:42,120,214;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#262624; --border:#33332f;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86; --accent:#3987e5;
    --b-sc:#3987e5; --b-roll:#d95926; --b-cut:#199e70; --b-shoot:#c98500; --b-post:#d55181;
    --b-trans:#6b6a64; --b-put:#8f8e86; --b-other:#45443f;
    --pos:57,135,229; --neg:230,103,103; --seq:57,135,229;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#262624; --border:#33332f;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86; --accent:#3987e5;
  --b-sc:#3987e5; --b-roll:#d95926; --b-cut:#199e70; --b-shoot:#c98500; --b-post:#d55181;
  --b-trans:#6b6a64; --b-put:#8f8e86; --b-other:#45443f;
  --pos:57,135,229; --neg:230,103,103; --seq:57,135,229;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border)}
.topin{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--ink-2);padding:6px 10px;border-radius:6px;font-weight:500}
nav a.on{background:var(--surface-2);color:var(--ink)} nav a:hover{text-decoration:none;background:var(--surface-2)}
.spacer{flex:1}
button.theme{background:none;border:1px solid var(--border);color:var(--ink-2);border-radius:6px;padding:5px 9px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:14px;margin:0 0 8px;color:var(--ink-2)}
.sub{color:var(--ink-2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0 16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.tile .l{color:var(--ink-3);font-size:12px} .tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums} .tile .c{color:var(--ink-2);font-size:12px}
.dsw{text-align:center;color:var(--ink-3);font-size:11px;letter-spacing:-1px;width:56px}
.tile.dson{border-color:var(--accent)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--ink-2);font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.controls label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-3);gap:3px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--ink-2);padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.tw{overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:600;z-index:1}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--ink)}
th .ar{color:var(--accent)}
th.grp{text-align:center;border-left:1px solid var(--border)}
td.l,th.l{text-align:left}
.tw table tr>:first-child{position:sticky;left:0;background:var(--surface);z-index:2} .tw thead tr>:first-child{background:var(--surface-2);z-index:3} td.bl,th.bl{border-left:1px solid var(--border)}
tr.subrow td{color:var(--ink-2);font-size:13px} tr.subrow td.l{padding-left:26px}
tr.avg td{font-style:italic;color:var(--ink-2);background:var(--surface-2)}
tr.hl td{font-weight:650}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.pc{display:inline-block;min-width:34px;padding:1px 6px;border-radius:5px;text-align:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toggle{cursor:pointer;color:var(--ink-3);display:inline-block;width:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin:6px 0 4px}
.note{font-size:12px;color:var(--ink-3);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:50;display:none;max-width:280px}
.tip b{display:block;margin-bottom:2px}
svg text{fill:var(--ink-2);font-size:11px}
.teamcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.teamcard{display:block;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.teamcard:hover{text-decoration:none;border-color:var(--accent)}
.teamcard .n{font-weight:650}
.gl dt{font-weight:650;margin-top:10px} .gl dd{margin:2px 0 0 0;color:var(--ink-2)}
.gl table td,.gl table th{text-align:left;white-space:normal}
.pbar{height:8px;background:var(--surface-2);border-radius:4px;position:relative;margin-top:4px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.empty{color:var(--ink-3);padding:20px;text-align:center}
button.pg{font:inherit;background:var(--surface);border:1px solid var(--border);color:var(--ink-2);border-radius:6px;padding:5px 12px;cursor:pointer} button.pg:disabled{opacity:.4;cursor:default}
@media (max-width:640px){.g2{grid-template-columns:1fr} main{padding:12px}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">D-I Play Types <small id="metaLine"></small></div>
  <nav id="nav">
    <a href="#overview" data-p="overview">Overview</a><a href="#team" data-p="team">Team</a><a href="#player" data-p="player">Player</a><a href="#matchup" data-p="matchup">Matchup</a>
    <a href="#team-leaderboard" data-p="team-leaderboard">Team Leaderboard</a><a href="#player-leaderboard" data-p="player-leaderboard">Player Leaderboard</a><a href="#glossary" data-p="glossary">Glossary</a>
  </nav>
  <div class="spacer"></div>
  <button class="theme" id="themeBtn" title="Toggle light/dark">Light / Dark</button>
</div></header>
<main id="app"><div class="empty">Loading every D-I team and player…</div></main>
<div class="tip" id="tip"></div>
<script>
"use strict";
(async function(){
let DATA;
try{
  const get=u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(u+" "+r.status); return r.json(); });
  const [C,PL]=await Promise.all([get("data/core.json"),get("data/players.json")]);
  DATA=inflate(C,PL);
}catch(err){ document.getElementById("app").innerHTML=`<div class="empty">Could not load the data (${String(err.message||err).replace(/[<>&]/g,"")}). Reload the page to try again.</div>`; return; }
// ---------------------------------------------------------------- data inflation (compact JSON -> the AE dashboard's record shapes)
function inflate(C,PL){
  const T=C.teams.map(([id,name,short,conf])=>({id,name,short,conf}));
  const rec=(row,name,games)=>{ const [u,bi,plays,points,freq,fhc,ppp,fp,pp,tov,tvp]=row; const [bucket,sub]=C.bs[bi];
    return {team:name,bucket,sub,games,plays,plays_pg:games?plays/games:null,points,ppg:games?points/games:null,freq,freq_halfcourt:fhc,ppp,freq_pctile:fp,ppp_pctile:pp,tov_rate:tov,tov_rate_pctile:tvp}; };
  const tt=rows=>rows.map(r=>rec(r,T[r[0]].name,C.tgames[r[0]]));
  const P=PL.players.map(([id,t,player,role,src,detail,games])=>({id,team:T[t].name,player,role,role_source:src,role_detail:detail,games}));
  const prow=PL.rows.map(r=>{ const p=P[r[0]]; const o=rec(r,p.team,p.games); o.player=p.player; o.role=p.role; o.pid=r[0]; return o; });
  const psc=PL.sc.map(r=>{ const p=P[r[0]]; const o={team:p.team,player:p.player,role:p.role,games:p.games,pid:r[0]}; PL.sc_cols.forEach((k,i)=>o[k]=r[i+1]); return o; });
  const tn=x=>({...x,team:T[x.t].name});
  return {meta:C.meta, T, bs:C.bs, confs:C.confs, conf_files:C.conf_files, players_meta:P,
    team_offense:tt(C.toff), team_defense:tt(C.tdef), team_offense_selfcreation:C.sc_off.map(tn), team_defense_selfcreation:C.sc_def.map(tn),
    team_archetypes:C.arche.map(tn), team_def_schemes:(C.dsch||[]).map(tn), player_offense:prow, player_selfcreation:psc, d1avg_off:C.d1avg_off, d1avg_def:C.d1avg_def, team_games:[],
    short:Object.fromEntries(T.map(t=>[t.name,t.short]))};
}
// ---------------------------------------------------------------- constants
const BUCKETS = ["Self-Creation","Rollers","Off-Ball Cutters","Off-Ball Shooters","Post-Ups"];
const CONTEXT = ["Transition","Putbacks","Other"];
const ALLB = BUCKETS.concat(CONTEXT);
const BVAR = {"Self-Creation":"--b-sc","Rollers":"--b-roll","Off-Ball Cutters":"--b-cut","Off-Ball Shooters":"--b-shoot",
  "Post-Ups":"--b-post","Transition":"--b-trans","Putbacks":"--b-put","Other":"--b-other"};
const SHORT = {"Self-Creation":"Self-Create","Rollers":"Rollers","Off-Ball Cutters":"Cutters","Off-Ball Shooters":"Shooters","Post-Ups":"Post-Ups","Transition":"Transition","Putbacks":"Putbacks","Other":"Other"};
const SUBS = {"Self-Creation":["Pull-Up 3","Mid-Range Dribble Jumper","Rim","Turnovers"],"Rollers":["Roll to Rim","Turnovers"],
  "Off-Ball Cutters":["Cut","Turnovers"],"Off-Ball Shooters":["Catch-and-Shoot 3","Big-Assisted C&S 3","Big C&S 3","Catch-and-Shoot 2","Turnovers"],
  "Post-Ups":["Post-Up Scoring","High-Low","Turnovers"],"Transition":[],"Putbacks":[],"Other":["Team Turnover"]};
// sub-buckets come from the data, so a sub-bucket added to the model shows up without a template change
if(DATA && DATA.bs){ for(const k in SUBS) SUBS[k]=[]; DATA.bs.forEach(([b,s])=>{ if(s!=="All") (SUBS[b]||(SUBS[b]=[])).push(s); }); }
const ROLES = ["On-Ball Guard","Wing","Stretch Big","Big"];
const CSSC={}; const css = v => CSSC[v]!==undefined? CSSC[v] : (CSSC[v]=getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const bcol = b => `var(${BVAR[b]||"--b-other"})`;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v==="number" && isFinite(v);
const f1 = v => isNum(v)? v.toFixed(1) : "—";
const f2 = v => isNum(v)? v.toFixed(2) : "—";
const f3 = v => isNum(v)? v.toFixed(3) : "—";
const fp = v => isNum(v)? v.toFixed(1)+"%" : "—";
const f0 = v => isNum(v)? String(Math.round(v)) : "—";
const shortTeam = t => (DATA.short && DATA.short[t]) || t;
const enc = encodeURIComponent;

// ---------------------------------------------------------------- data prep
const D = DATA;
const TEAMS = D.T.map(t=>t.name).sort();
const TINFO = Object.fromEntries(D.T.map(t=>[t.name,t]));
const CONFS = D.confs;
const confOf = t => (TINFO[t]||{}).conf||"";
const TEAMS_BY_CONF = Object.fromEntries(CONFS.map(c=>[c,TEAMS.filter(t=>confOf(t)===c)]));
const arch = Object.fromEntries(D.team_archetypes.map(r=>[r.team,r]));
const TROWS = {off:{},def:{}};
D.team_offense.forEach(r=>(TROWS.off[r.team]||(TROWS.off[r.team]=[])).push(r));
D.team_defense.forEach(r=>(TROWS.def[r.team]||(TROWS.def[r.team]=[])).push(r));
function teamRows(side,team){ return TROWS[side==="def"?"def":"off"][team]||[]; }
// grouped team picker (by conference)
function teamOptions(cur){ return CONFS.map(c=>`<optgroup label="${esc(c)}">${TEAMS_BY_CONF[c].map(t=>`<option value="${esc(t)}" ${t===cur?"selected":""}>${esc(shortTeam(t))}</option>`).join("")}</optgroup>`).join(""); }
function confOptions(cur,allLabel){ return `<option value="">${allLabel||"All conferences"}</option>`+CONFS.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join(""); }
function getRow(rows,b,s){ return rows.find(r=>r.bucket===b && r.sub===(s||"All")); }
function totals(rows){ // from bucket "All" rows
  const a = rows.filter(r=>r.sub==="All");
  const plays=a.reduce((s,r)=>s+(r.plays||0),0), pts=a.reduce((s,r)=>s+(r.points||0),0);
  const g = Math.max(...a.map(r=>r.games||0));
  return {plays,pts,games:g,ppg:pts/g,plays_pg:plays/g,ppp:plays?pts/plays:null};
}
const d1avg = side => D["d1avg_"+side]||[];
function avgRow(side,b,s){ return d1avg(side).find(r=>r.bucket===b && r.sub===(s||"All")); }

// players
const PLAYERS = (()=>{
  const m=new Map();
  for(const r of D.player_offense){
    const k=r.team+"|"+r.player;
    if(!m.has(k)){ const pm=D.players_meta[r.pid]; m.set(k,{team:r.team,player:r.player,role:r.role,role_source:pm.role_source,role_detail:pm.role_detail,conf:confOf(r.team),rows:[]}); }
    m.get(k).rows.push(r);
  }
  const sc = Object.fromEntries((D.player_selfcreation||[]).map(r=>[r.team+"|"+r.player,r]));
  for(const [k,p] of m){
    const t=totals(p.rows); Object.assign(p,t); p.sc=sc[k]||null; p.key=k;
    p.freq={}; p.bppp={};
    for(const b of ALLB){ const r=getRow(p.rows,b); p.freq[b]=r?r.freq:0; p.bppp[b]=r?r.ppp:null; }
    p.primary = BUCKETS.slice().sort((a,b)=>(p.freq[b]||0)-(p.freq[a]||0))[0];
  }
  return [...m.values()];
})();
const pByKey = Object.fromEntries(PLAYERS.map(p=>[p.key,p]));
const PLAYERS_BY_TEAM = {}; PLAYERS.forEach(p=>(PLAYERS_BY_TEAM[p.team]||(PLAYERS_BY_TEAM[p.team]=[])).push(p));
Object.values(PLAYERS_BY_TEAM).forEach(a=>a.sort((x,y)=>x.player.localeCompare(y.player)));
const SRC_LABEL = {"Sheet":"Tanner's sheet","Positional list":"Positional list","Archetype list":"Archetype list","Ratings + stats":"Ratings file + stats","Inferred":"Stat-inferred"};
// PPP rank pools per bucket (players with 10+ plays), built on first use
const RANKS = {};
function rankOf(p,b,scope){
  const key=b+"|"+(scope==="conf"?p.conf:"");
  if(!RANKS[key]){ const pool=PLAYERS.filter(x=>(scope!=="conf"||x.conf===p.conf)&&x.bppp[b]!=null&&(getRow(x.rows,b)||{}).plays>=10).sort((x,y)=>y.bppp[b]-x.bppp[b]); RANKS[key]=new Map(pool.map((x,i)=>[x,i])); RANKS[key].n=pool.length; }
  const m=RANKS[key]; return m.has(p)?`${m.get(p)+1} of ${m.n}`:"—";
}
// game-by-game files, one per conference, fetched when a team page needs them
const GAMEFILES = {}; // conf -> "loading" | {games, rows}
function confGames(conf, onload){
  const g=GAMEFILES[conf]; if(g && !g.waiting) return g;
  if(!g){ const w=GAMEFILES[conf]={waiting:[]}; const done=j=>{ GAMEFILES[conf]=j; w.waiting.forEach(f=>f()); };
    fetch(D.conf_files[conf]).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(done).catch(()=>done({games:{},rows:[],failed:true})); }
  if(onload) GAMEFILES[conf].waiting.push(onload);
  return null;
}

// ---------------------------------------------------------------- color helpers
function pctStyle(p, kind){ // kind: "eff" diverging (100 good), "freq" sequential
  if(!isNum(p)) return "";
  if(kind==="freq"){ const a=(p/100)*0.45; return `background:rgba(${css("--seq")},${a.toFixed(3)})`; }
  const d=(p-50)/50, a=Math.abs(d)*0.5; const c = d>=0? css("--pos") : css("--neg");
  return `background:rgba(${c},${a.toFixed(3)})`;
}
function pcell(p,kind,extra){ return `<td class="${extra||""}"><span class="pc" style="${pctStyle(p,kind)}">${f0(p)}</span></td>`; }
// defense frequency allowed: the number stays the plain percentile (100 = allows it most), the shading follows what is good for the defense (allowing more = redder, less = bluer)
function pcellDefFreq(p,extra){ return `<td class="${extra||""}"><span class="pc" style="${pctStyle(isNum(p)?100-p:p,"eff")}">${f0(p)}</span></td>`; }

// ---------------------------------------------------------------- tooltip
const tip=document.getElementById("tip");
function showTip(e,html){ tip.innerHTML=html; tip.style.display="block"; moveTip(e); }
function moveTip(e){ const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+h>innerHeight-8) y=e.clientY-h-14; tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.style.display="none"; }
document.addEventListener("mouseover",e=>{ const t=e.target.closest("[data-tip]"); if(t) showTip(e,t.getAttribute("data-tip")); });
document.addEventListener("mousemove",e=>{ if(tip.style.display==="block"){ if(e.target.closest("[data-tip]")) moveTip(e); else hideTip(); } });

// ---------------------------------------------------------------- charts (plain SVG)
// Stacked 100% horizontal bars: rows = [{label, href, mix:{bucket:freq}, sub}]
function mixChart(rows, opts={}){
  const W=opts.width||760, lw=opts.labelW||170, bh=22, gap=10, top=4;
  const H=top+rows.length*(bh+gap);
  const iw=W-lw-10;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.aria||"Play-type mix")}">`;
  rows.forEach((r,i)=>{
    const y=top+i*(bh+gap); let x=lw;
    const lab = r.href? `<a href="${r.href}"><text x="${lw-8}" y="${y+bh/2+4}" text-anchor="end" style="fill:var(--ink);font-weight:${r.bold?650:400}">${esc(r.label)}</text></a>`
                       : `<text x="${lw-8}" y="${y+bh/2+4}" text-anchor="end" style="fill:var(--ink);font-style:${r.italic?"italic":"normal"}">${esc(r.label)}</text>`;
    s+=lab;
    const tot = ALLB.reduce((a,b)=>a+(r.mix[b]||0),0)||100;
    ALLB.forEach(b=>{
      const v=r.mix[b]||0; if(v<=0) return; const w=iw*v/tot; const ww=Math.max(w-2,0.5);
      const t=`<b>${esc(r.label)}</b>${esc(b)}: ${fp(v)} of plays${isNum(r.ppp&&r.ppp[b])?`<br>PPP ${f3(r.ppp[b])}`:""}`;
      s+=`<rect x="${x.toFixed(1)}" y="${y}" width="${ww.toFixed(1)}" height="${bh}" rx="3" style="fill:${bcol(b)}" data-tip="${esc(t)}"></rect>`;
      if(w>34) s+=`<text x="${(x+w/2).toFixed(1)}" y="${y+bh/2+4}" text-anchor="middle" style="fill:#fff;font-weight:600;pointer-events:none">${Math.round(v)}</text>`;
      x+=w;
    });
  });
  s+="</svg>";
  return mixLegend()+s;
}
function mixLegend(){ return `<div class="legend">${ALLB.map(b=>`<span><span class="sw" style="background:${bcol(b)}"></span>${b}</span>`).join("")}</div>`; }

// Percentile dot plot: rows=[{label, a, b}] a=freq pctile, b=ppp pctile
function pctDots(rows, labels){
  const W=560, lw=130, rh=30, top=22; const H=top+rows.length*rh+18; const iw=W-lw-20;
  const X=p=>lw+iw*p/100;
  let s=`<div class="legend"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" style="fill:none;stroke:var(--ink-2);stroke-width:2"/></svg> ${labels[0]}</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" style="fill:var(--accent)"/></svg> ${labels[1]}</span></div>`;
  s+=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Percentiles by play type">`;
  [0,25,50,75,100].forEach(t=>{ s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${top-6}" y2="${H-18}" style="stroke:var(--border);stroke-width:1;${t===50?"stroke-dasharray:3 3":""}"/><text x="${X(t)}" y="${H-4}" text-anchor="middle">${t}</text>`; });
  s+=`<text x="${X(0)}" y="11">D-I percentile</text>`;
  rows.forEach((r,i)=>{
    const y=top+i*rh+rh/2-4;
    s+=`<text x="${lw-8}" y="${y+4}" text-anchor="end" style="fill:var(--ink)">${esc(r.label)}</text>`;
    s+=`<line x1="${X(0)}" x2="${X(100)}" y1="${y}" y2="${y}" style="stroke:var(--surface-2);stroke-width:6;stroke-linecap:round"/>`;
    if(isNum(r.a)&&isNum(r.b)) s+=`<line x1="${X(r.a)}" x2="${X(r.b)}" y1="${y}" y2="${y}" style="stroke:var(--ink-3);stroke-width:2"/>`;
    const tt=`<b>${esc(r.label)}</b>${labels[0]}: ${f0(r.a)}<br>${labels[1]}: ${f0(r.b)}${r.extra?"<br>"+r.extra:""}`;
    if(isNum(r.a)) s+=`<circle cx="${X(r.a)}" cy="${y}" r="6" style="fill:var(--surface);stroke:var(--ink-2);stroke-width:2" data-tip="${esc(tt)}"/>`;
    if(isNum(r.b)) s+=`<circle cx="${X(r.b)}" cy="${y}" r="6" style="fill:var(--accent);stroke:var(--surface);stroke-width:2" data-tip="${esc(tt)}"/>`;
    if(!isNum(r.a)&&!isNum(r.b)) s+=`<text x="${X(50)}" y="${y+4}" text-anchor="middle" style="fill:var(--ink-3)">under 10 plays, no percentile</text>`;
  });
  return s+"</svg>";
}

// ---------------------------------------------------------------- sortable table
// cols: [{k, label, fmt(row)->html td, val(row)->sortable, cls, grp}]
const tableState = {};
function sortTable(id, cols, rows, opts={}){
  const st = tableState[id] || (tableState[id]={k:opts.sortK, dir:opts.dir||-1});
  const col = cols.find(c=>c.k===st.k) || cols[0];
  const sorted = rows.slice();
  sorted.sort((a,b)=>{
    const va=col.val(a), vb=col.val(b);
    const na = va==null || (typeof va==="number"&&!isFinite(va)), nb = vb==null || (typeof vb==="number"&&!isFinite(vb));
    if(na&&nb) return 0; if(na) return 1; if(nb) return -1;
    const c = typeof va==="string"? va.localeCompare(vb) : va-vb;
    return st.dir===1? c : -c;
  });
  let h = `<div class="tw" style="max-height:${opts.maxH||"none"}"><table id="${id}">`;
  if(opts.groups) h += `<thead><tr>${opts.groups.map(g=>`<th class="${g.cls||""} grp" colspan="${g.span}">${esc(g.label)}</th>`).join("")}</tr>`;
  else h += `<thead>`;
  h += `<tr>${cols.map(c=>`<th class="s ${c.cls||""}" data-k="${esc(c.k)}" ${c.title?`title="${esc(c.title)}"`:""}>${c.label}${c.k===st.k?` <span class="ar">${st.dir===1?"▲":"▼"}</span>`:""}</th>`).join("")}</tr></thead><tbody>`;
  if(opts.pinned) h += opts.pinned;
  if(!sorted.length) h += `<tr><td colspan="${cols.length}" class="empty">No rows match these filters.</td></tr>`;
  (opts.slice? sorted.slice(opts.slice[0],opts.slice[1]) : sorted).forEach((r,i)=>{ h += `<tr class="${opts.rowCls?opts.rowCls(r):""}">${cols.map(c=>c.fmt(r,i)).join("")}</tr>`; });
  h += `</tbody></table></div>`;
  return h;
}
function wireSort(id, rerender){
  const t=document.getElementById(id); if(!t) return;
  t.querySelectorAll("th.s").forEach(th=>th.addEventListener("click",()=>{
    const k=th.dataset.k, st=tableState[id];
    if(st.k===k) st.dir*=-1; else { st.k=k; st.dir = (th.classList.contains("l")? 1 : -1); }
    // keep the table's horizontal/vertical scroll and the page scroll where they were
    const box=t.closest(".tw"), sl=box?box.scrollLeft:0, stp=box?box.scrollTop:0, wx=window.scrollX, wy=window.scrollY;
    rerender();
    const nt=document.getElementById(id), nb=nt&&nt.closest(".tw");
    if(nb){ nb.scrollLeft=sl; nb.scrollTop=stp; }
    window.scrollTo(wx,wy);
  }));
}

    {k:"steal",label:"Steal TOV",fmt:r=>td(fp(r.steal)),val:r=>r.steal,title:"Share of opponents' half-court plays ending in a steal (live-ball turnover)"},
    {k:"rim",label:"Rim rate",fmt:r=>td(fp(r.rim)),val:r=>r.rim,title:"Share of opponents' half-court FGA at the rim (4 ft or less)"},

const GL_CACHE={};
function gameList(team,side){
  const ck=team+"|"+side; if(GL_CACHE[ck]) return GL_CACHE[ck];
  const F=confGames(confOf(team)); if(!F) return null;
  const ti=D.T.findIndex(t=>t.name===team), si=side==="def"?1:0;
  const m=new Map();
  for(const r of F.rows){ if(r[0]!==ti||r[1]!==si) continue;
    const [,,gid,bi,plays,points,freq,fhc,ppp,tov]=r;
    if(!m.has(gid)){ const g=F.games[gid]||["",null,null,null,null,false]; const home=g[1]===ti; const opp=D.T[home?g[2]:g[1]];
      const ts=home?g[3]:g[4], os=home?g[4]:g[3];
      m.set(gid,{game_id:gid,date:g[0],opponent:opp?opp.short:"",home_away:g[5]?"N":home?"H":"A",result:(ts==null||os==null)?"":`${ts>os?"W":"L"} ${ts}-${os}`,rows:[]}); }
    const [bucket,sub]=D.bs[bi]; m.get(gid).rows.push({bucket,sub,plays,points,freq,freq_halfcourt:fhc,ppp,tov_rate:tov});
  }
  return GL_CACHE[ck]=[...m.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function barsByGame(games,getV,fmtV,ref,refLab,color,title){
  const W=560,H=190,l=44,r=10,t=28,b=34; const iw=W-l-r, ih=H-t-b;
  const vals=games.map(getV); const mx=Math.max(...vals.filter(isNum),isNum(ref)?ref:0)*1.15||1;
  const bw=iw/Math.max(games.length,1);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}"><text x="0" y="12" style="fill:var(--ink);font-weight:600">${esc(title)}</text>`;
  [0,0.5,1].forEach(f=>{const y=t+ih-ih*f; s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" style="stroke:var(--border)"/><text x="${l-6}" y="${y+4}" text-anchor="end">${fmtV(mx*f)}</text>`;});
  games.forEach((g,i)=>{ const v=vals[i]; const w=Math.min(bw*0.6,36), x=l+i*bw+(bw-w)/2;
    if(isNum(v)){ const h=ih*v/mx; s+=`<rect x="${x}" y="${t+ih-h}" width="${w}" height="${Math.max(h,0.5)}" rx="3" style="fill:${color}" data-tip="${esc(`<b>${g.date} ${g.home_away==="H"?"vs":g.home_away==="N"?"vs (N)":"at"} ${g.opponent}</b>${g.result}<br>${fmtV(v)}`)}"/>`; }
    const lab=String(g.opponent||"").split(" ")[0]; s+=`<text x="${x+w/2}" y="${H-18}" text-anchor="middle">${esc(lab.slice(0,10))}</text><text x="${x+w/2}" y="${H-5}" text-anchor="middle" style="fill:var(--ink-3)">${esc(String(g.date||"").slice(5))}</text>`; });
  if(isNum(ref)){ const y=t+ih-ih*ref/mx; s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" style="stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3"/><line x1="${W-r-150}" x2="${W-r-132}" y1="8" y2="8" style="stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3"/><text x="${W-r}" y="12" text-anchor="end" style="fill:var(--ink-2)">${esc(refLab)} ${fmtV(ref)}</text>`; }
  return s+"</svg>";
}

function muTot(rows){
  const a=rows.filter(r=>r.sub==="All"); if(!a.length) return {plays:0,pts:0,games:0,ppp:null,plays_pg:null,ppg:null,tov:null};
  const t=totals(rows); const tv=a.reduce((s,r)=>s+(r.plays||0)*(r.tov_rate||0)/100,0); t.tov=t.plays?100*tv/t.plays:null; return t;
}
let MU_TOTS=null; // team -> {off,def}; percentiles of the overall numbers need every team
function muTots(){ if(!MU_TOTS){ MU_TOTS={}; MU.teams.forEach(t=>MU_TOTS[t]={off:muTot(MU.rows("off",t)),def:muTot(MU.rows("def",t))}); } return MU_TOTS; }
function muPct(team,side,k,hiGood){ // percentile among all teams; hiGood: a higher value ranks higher
  if(MU.teams.length<60) return null;
  const T=muTots(), v=T[team][side][k]; if(!isNum(v)) return null;
  const vals=MU.teams.map(t=>T[t][side][k]).filter(isNum);
  const below=vals.filter(x=>hiGood? x<v : x>v).length, eq=vals.filter(x=>x===v).length;
  return Math.round(100*(below+0.5*eq)/vals.length);
}
const MU_AVG = (()=>{ // overall D-I average PPP from the bucket rows
  const rs=ALLB.map(b=>MU.avgRow("off",b)).filter(Boolean); const f=rs.reduce((s,r)=>s+(r.freq||0),0);
  return {ppp: f? rs.reduce((s,r)=>s+(r.freq||0)*(r.ppp||0),0)/f : null};
})();
function muChip(p,kind,good){ // blue = good, red = bad, shaded by "good" (a 0-100 goodness score; defaults to p). kind "pace": neutral grey
  if(!isNum(p)) return `<span class="mu-chip" style="color:var(--ink-3)">—</span>`;
  let st;
  if(kind==="pace") st=`background:color-mix(in srgb,var(--ink) ${(4+22*p/100).toFixed(1)}%,transparent)`;
  else { const g=isNum(good)?good:p, d=(g-50)/50; st=`background:rgba(${css(d>=0?"--pos":"--neg")},${(0.10+Math.abs(d)*0.55).toFixed(3)})`; }
  return `<span class="mu-chip" style="${st}">${Math.round(p)}</span>`;
}
// one comparison row: o/d = {v (display), p (percentile)}, kind ("eff" | "freq" | "pace"), sub (smaller sub-bucket row)
// "freq": the offense chip is blue when it runs the play type often; the defense chip is blue when it allows it rarely (shading uses 100 - percentile)
function muRow(label,o,d,kind,opts={}){
    return `<tr class="${opts.sub?"sub":""}"><td class="o">${o.v}</td><td>${o.p===undefined?"":muChip(o.p,kind)}</td><td class="st">${label}</td>
    <td>${d.p===undefined?"":muChip(d.p,kind,kind==="freq"&&isNum(d.p)?100-d.p:undefined)}</td><td class="d">${d.v}</td></tr>`;
}
function muCard(title,a,b,body){
  return `<div class="mu-card"><div class="hd"><b>${title}</b><span>${muName(a)} offense vs. ${muName(b)} defense</span></div>
   <table class="mu"><colgroup><col class="v"><col class="c"><col class="s"><col class="c"><col class="v"></colgroup>
   <thead><tr><th class="o"><span class="tn">${muName(a)} </span><em>Off</em></th><th>%ile</th><th>Stat</th><th>%ile</th><th class="d"><span class="tn">${muName(b)} </span><em>Def</em></th></tr></thead>
   <tbody>${body}</tbody></table></div>`;
}
function muOverall(a,b){
  const To=muTots()[a].off, Td=muTots()[b].def;
  const po=muPct(a,"off","ppp",true), pd=muPct(b,"def","ppp",false);
  const to=muPct(a,"off","tov",false), tdp=muPct(b,"def","tov",true);
  return muCard("Overall",a,b,
    muRow("Points per play",{v:f3(To.ppp),p:po},{v:f3(Td.ppp),p:pd},"eff")+
    muRow("Turnover rate",{v:fp(To.tov),p:to},{v:fp(Td.tov),p:tdp},"eff")+
    muRow("Plays per game",{v:f1(To.plays_pg),p:muPct(a,"off","plays_pg",true)},{v:f1(Td.plays_pg),p:muPct(b,"def","plays_pg",true)},"pace"));
}
function muBucket(b0,a,b){

        muRow("PPP",{v:f3(o.ppp),p:o.ppp_pctile},{v:f3(d.ppp),p:d.ppp_pctile},"eff");
  if((SUBS[b0]||[]).length) h+=muRow("Turnover rate",{v:fp(o.tov_rate)},{v:fp(d.tov_rate)},"eff");
  (SUBS[b0]||[]).filter(s=>s!=="Turnovers").forEach(s=>{
    const so=getRow(off,b0,s)||{}, sd=getRow(def,b0,s)||{};

}
function muExp(a,b){ const To=muTots()[a].off, Td=muTots()[b].def; return isNum(To.ppp)&&isNum(Td.ppp)&&isNum(MU_AVG.ppp)? To.ppp+Td.ppp-MU_AVG.ppp : null; }
function pageMatchup(h){

  const side=tlb.side, def=side==="def";
  const bOpts=`<option value="__overview">All buckets (overview)</option>${ALLB.filter(b=>b!=="Other").map(b=>`<option ${tlb.bucket===b?"selected":""}>${b}</option>`).join("")}<option value="__sc" ${tlb.bucket==="__sc"?"selected":""}>Self-Creation passing</option>`;

  const sOpts = ["All",...subs].map(s=>`<option ${tlb.sub===s?"selected":""}>${s}</option>`).join("");
  const teamCell={k:"team",label:"Team",cls:"l",fmt:r=>r.__avg?td("D-I average","l"):`<td class="l"><a href="${hrefT(r.team)}">${esc(r.team)}</a></td>`,val:r=>r.team};

  let body="", id="tlb_"+side+"_"+tlb.bucket.replace(/\W/g,"")+"_"+tlb.sub.replace(/\W/g,"");
  if(tlb.bucket==="__overview"){
    const rows=LT.map(t=>{const rs=teamRows(side,t); const o={team:t,...totals(rs)}; ALLB.forEach(b=>{const r=getRow(rs,b)||{}; o["f_"+b]=r.freq; o["fp_"+b]=r.freq_pctile; o["p_"+b]=r.ppp; o["pp_"+b]=r.ppp_pctile;}); return o;});
    const cols=[teamCell,confCell,...(def?[archCell]:[]),{k:"games",label:"G",fmt:r=>td(f0(r.games)),val:r=>r.games},{k:"plays_pg",label:"Plays/G",fmt:r=>td(f1(r.plays_pg)),val:r=>r.plays_pg},{k:"ppp",label:def?"PPP allowed":"PPP",fmt:r=>td(f3(r.ppp)),val:r=>r.ppp}];
    const groups=[{label:"",span:(def?1:0)+5}];
    ALLB.filter(b=>b!=="Other").forEach(b=>{ groups.push({label:b,span:4,cls:"bl"});
      cols.push({k:"f_"+b,label:"Freq",cls:"bl",fmt:r=>td(fp(r["f_"+b]),"bl"),val:r=>r["f_"+b]});
      cols.push({k:"fp_"+b,label:"Freq %ile",fmt:r=>def?pcellDefFreq(r["fp_"+b]):pcell(r["fp_"+b],"freq"),val:r=>r["fp_"+b],title:def?"100 = opponents run it most often against them":"100 = runs it most often in D-I"});
      cols.push({k:"p_"+b,label:def?"PPP allowed":"PPP",fmt:r=>td(f3(r["p_"+b])),val:r=>r["p_"+b]});
      cols.push({k:"pp_"+b,label:"Eff. %ile",fmt:r=>pcell(r["pp_"+b],"eff"),val:r=>r["pp_"+b],title:def?"100 = fewest points allowed per play":"100 = most efficient in D-I"});
    });
    body=sortTable(id,cols,rows,{sortK:"ppp",dir:def?1:-1,groups,maxH:"75vh"})+`<p class="note">Freq %ile = how often vs. D-I (style, single blue scale). Eff. %ile = PPP vs. D-I: blue = better than median, red = worse${def?"; on defense, 100 = fewest points allowed per play":""}. Scroll sideways for Transition and Putbacks. Pick a single bucket above for plays, points and per-game columns.</p>`;
  } else if(tlb.bucket==="__sc"){
    const rows=(def?D.team_defense_selfcreation:D.team_offense_selfcreation).filter(r=>!tlb.conf||confOf(r.team)===tlb.conf);
    const cols=[teamCell,confCell,archCell,
      {k:"games",label:"G",fmt:r=>td(f0(r.games)),val:r=>r.games},
      {k:"sc_plays",label:"SC plays",fmt:r=>td(f1(r.sc_plays)),val:r=>r.sc_plays},
      {k:"sc_assists",label:"SC ast",fmt:r=>td(f0(r.sc_assists)),val:r=>r.sc_assists},
      {k:"sc_ast_pg",label:"SC ast/G",fmt:r=>td(f2(r.sc_ast_pg)),val:r=>r.sc_ast_pg},
      {k:"sc_ast_rate",label:"SC ast rate",fmt:r=>td(fp(r.sc_ast_rate)),val:r=>r.sc_ast_rate},
      {k:"sc_ast_rate_pctile",label:"%ile",fmt:r=>pcell(r.sc_ast_rate_pctile,"freq"),val:r=>r.sc_ast_rate_pctile},
      {k:"sc_tov_rate",label:"SC TOV rate",fmt:r=>td(fp(r.sc_tov_rate)),val:r=>r.sc_tov_rate},
      {k:"sc_tov_rate_pctile",label:"%ile",fmt:r=>pcell(r.sc_tov_rate_pctile,"eff"),val:r=>r.sc_tov_rate_pctile},
      {k:"kick_ast_pg",label:"Kick-outs/G",fmt:r=>td(f2(r.kick_ast_pg)),val:r=>r.kick_ast_pg},
      {k:"kick_ast_pg_pctile",label:"%ile",fmt:r=>pcell(r.kick_ast_pg_pctile,"freq"),val:r=>r.kick_ast_pg_pctile},
      {k:"kick_ppp",label:"Kick-out PPP",fmt:r=>td(f3(r.kick_ppp)),val:r=>r.kick_ppp},
      {k:"kick_ppp_pctile",label:"%ile",fmt:r=>pcell(r.kick_ppp_pctile,"eff"),val:r=>r.kick_ppp_pctile},
      {k:"sc_ppp_incl_passing",label:"SC PPP incl. passing",fmt:r=>td(f3(r.sc_ppp_incl_passing)),val:r=>r.sc_ppp_incl_passing},
      {k:"shortroll_ast_pg",label:"Short-roll ast/G",fmt:r=>td(f2(r.shortroll_ast_pg)),val:r=>r.shortroll_ast_pg},
      {k:"postup_ast_pg",label:"Post-up ast/G",fmt:r=>td(f2(r.postup_ast_pg)),val:r=>r.postup_ast_pg},
      {k:"highlow_ast_pg",label:"High-low ast/G",fmt:r=>td(f2(r.highlow_ast_pg)),val:r=>r.highlow_ast_pg}];
    body=sortTable(id,cols,rows,{sortK:"sc_ast_rate",dir:-1,maxH:"75vh"})+`<p class="note">${def?"Defense: these are opponents' numbers against this team. ":""}SC assist rate %ile: 100 = highest assist rate in D-I. SC TOV rate %ile: ${def?"100 = forces the most Self-Creation turnovers":"100 = fewest Self-Creation turnovers"}. Kick-outs are assisted catch-and-shoot 3s from an On-Ball Guard (already counted in SC assists, not added again); Kick-out PPP is the PPP of those catch-and-shoot 3s, misses included${def?", 100 = allows the fewest points":""}.</p>`;
  } else {
    const rows=LT.map(t=>getRow(teamRows(side,t),tlb.bucket,tlb.sub)).filter(Boolean);
    const av=avgRow(side,tlb.bucket,tlb.sub);
    const cols=[teamCell,confCell,archCell,...statCols({def})];
    const AVK=["freq","freq_halfcourt","ppp","plays_pg","ppg","tov_rate"];
    const pinRow=(lab,a)=>`<tr class="avg">${cols.map(c=>c.k==="team"?td(esc(lab),"l"):(c.k==="arch"||c.k==="conf")?td("","l"):(AVK.includes(c.k)?c.fmt(a):td("",c.cls))).join("")}</tr>`;
    let pinned = av? pinRow("D-I average",av) : "";
    if(tlb.conf && rows.length){ const m=k=>rows.reduce((x,r)=>x+(r[k]||0),0)/rows.length; const pl=rows.reduce((x,r)=>x+(r.plays||0),0), pt=rows.reduce((x,r)=>x+(r.points||0),0);
      pinned = pinRow(tlb.conf+" average",{freq:m("freq"),freq_halfcourt:BUCKETS.includes(tlb.bucket)?m("freq_halfcourt"):null,plays_pg:m("plays_pg"),ppg:m("ppg"),tov_rate:m("tov_rate"),ppp:pl?pt/pl:null}) + pinned; }
    body=sortTable(id,cols,rows,{sortK:"ppp",dir:def?1:-1,pinned,maxH:"75vh"})+`<p class="note">The average rows stay pinned${tlb.conf?" (conference average: mean of its teams; PPP pooled)":""}. ${def?"On defense, PPP %ile 100 = fewest points allowed per play; Freq %ile 100 = opponents run it most often.":"PPP %ile 100 = most efficient in D-I; Freq %ile 100 = runs it most often."}</p>`;
  }
  app.innerHTML=`<h1>Team leaderboard: ${def?"Defense":"Offense"}</h1><p class="sub">${tlb.conf?`${esc(tlb.conf)}: ${LT.length} teams`:`All ${TEAMS.length} D-I teams`}. Percentiles rank against all of D-I. Click any column header to sort.</p>

   <label>Conference<select id="cSel">${confOptions(tlb.conf)}</select></label></div>
   <div class="card">${body}</div>`;
  document.querySelectorAll("#sideSeg button").forEach(b=>b.onclick=()=>{ tlb.side=b.dataset.s; pageTeamLB(); });

// ---------------------------------------------------------------- player leaderboard
const plb={bucket:"Self-Creation",sub:"All",conf:"",team:"",role:"",min:10,q:"",metric:"freq",page:0};
const PAGE=100; let qt=null;
function pagedTable(id,cols,rows,opts){
  const n=rows.length, pages=Math.max(1,Math.ceil(n/PAGE)); if(plb.page>=pages) plb.page=pages-1; if(plb.page<0) plb.page=0;
  const a=plb.page*PAGE, b=Math.min(n,a+PAGE);
  const html=sortTable(id,cols,rows,{...opts,slice:[a,b]});
  const pager = n>PAGE? `<div class="controls" style="margin:10px 0 0;align-items:center"><button class="pg" data-pg="${plb.page-1}" ${plb.page?"":"disabled"}>‹ Prev</button><span style="font-size:12px;color:var(--ink-3)">Players ${a+1}–${b} of ${n}</span><button class="pg" data-pg="${plb.page+1}" ${plb.page<pages-1?"":"disabled"}>Next ›</button></div>` : `<p class="note">${n} player${n===1?"":"s"}</p>`;
  return html+pager;
}
function pagePlayerLB(){
  const bOpts=`<option value="__overview">All buckets (overview)</option>${ALLB.filter(b=>b!=="Other").map(b=>`<option ${plb.bucket===b?"selected":""}>${b}</option>`).join("")}<option value="__sc" ${plb.bucket==="__sc"?"selected":""}>Self-Creation passing</option>`;
  const subs=(SUBS[plb.bucket]||[]).filter(s=>s!=="Turnovers"); if(!["All",...subs].includes(plb.sub)) plb.sub="All";
  if(plb.team && plb.conf && confOf(plb.team)!==plb.conf) plb.team="";
  const pass = p => (!plb.conf||p.conf===plb.conf)&&(!plb.team||p.team===plb.team)&&(!plb.role||p.role===plb.role)&&(!plb.q||p.player.toLowerCase().includes(plb.q.toLowerCase()));
  const nameCell={k:"player",label:"Player",cls:"l",fmt:r=>`<td class="l"><a href="${hrefP(r.team,r.player)}">${esc(r.player)}</a></td>`,val:r=>r.player};
  const teamCell={k:"team",label:"Team",cls:"l",fmt:r=>`<td class="l"><a href="${hrefT(r.team)}">${esc(shortTeam(r.team))}</a></td>`,val:r=>r.team};
  const roleCell={k:"role",label:"Role",cls:"l",fmt:r=>{const p=pByKey[r.team+"|"+r.player]||{}; return `<td class="l" title="Role source: ${esc(SRC_LABEL[p.role_source]||"")}${p.role_detail?" ("+esc(p.role_detail)+")":""}">${esc(r.role)}</td>`;},val:r=>r.role};
  const confCell={k:"conf",label:"Conf.",cls:"l",fmt:r=>td(esc(confOf(r.team)),"l"),val:r=>confOf(r.team)};
  let body, id="plb_"+plb.bucket.replace(/\W/g,"")+"_"+plb.sub.replace(/\W/g,""), minLabel;
  if(plb.bucket==="__overview"){
    minLabel="Min total plays";
    const M={freq:["Freq",r=>r.freq,fp,null],plays_pg:["Plays/G",r=>r.plays_pg,f1,null],ppg:["Pts/G",r=>r.ppg,f1,null],ppp:["PPP",r=>r.ppp,f3,"eff"],freq_pctile:["Freq %ile",r=>r.freq_pctile,f0,"freq"],ppp_pctile:["Eff. %ile",r=>r.ppp_pctile,f0,"eff"],tov_rate:["TOV%",r=>r.tov_rate,fp,null]};

    const rows=PLAYERS.filter(p=>pass(p)&&p.plays>=plb.min);
    const cell=(p,b)=>{const r=getRow(p.rows,b); const v=r?mGet(r):null; const t=r?`<b>${esc(p.player)} · ${esc(b)}</b>${f1(r.plays_pg)} plays/G · ${f1(r.ppg)} pts/G<br>Freq ${fp(r.freq)} (%ile ${f0(r.freq_pctile)})<br>PPP ${f3(r.ppp)} (eff. %ile ${f0(r.ppp_pctile)})<br>TOV ${fp(r.tov_rate)}`:"";
      if(!isNum(v)) return `<td>—</td>`;
      const shade = mShade==="eff"? pctStyle(plb.metric==="ppp"?r.ppp_pctile:v,"eff") : mShade==="freq"? pctStyle(v,"freq"):"";
      return `<td data-tip="${esc(t)}"><span class="pc" style="${shade}">${mFmt(v)}</span></td>`;};
    const cols=[nameCell,teamCell,confCell,roleCell,{k:"games",label:"G",fmt:p=>td(f0(p.games)),val:p=>p.games},{k:"plays_pg",label:"Plays/G",fmt:p=>td(f1(p.plays_pg)),val:p=>p.plays_pg},{k:"ppg",label:"Pts/G",fmt:p=>td(f1(p.ppg)),val:p=>p.ppg},{k:"ppp",label:"PPP",fmt:p=>td(f3(p.ppp)),val:p=>p.ppp},
      ...ALLB.filter(b=>b!=="Other").map((b,i)=>({k:"m_"+b,label:SHORT[b],cls:i===0?"bl":"",title:b+": "+mLab,fmt:p=>cell(p,b).replace("<td",i===0?'<td class="bl"':"<td"),val:p=>{const r=getRow(p.rows,b); return r?mGet(r):null;}}))];
    body=`<div class="controls"><label>Show for each play type<select id="metSel">${Object.entries(M).map(([k,v])=>`<option value="${k}" ${plb.metric===k?"selected":""}>${v[0]}</option>`).join("")}</select></label></div>`+pagedTable(id+"_"+plb.metric,cols,rows,{sortK:"plays_pg",dir:-1,maxH:"70vh"})+`<p class="note">Hover any cell for that play type's full line. Pick a single play type above for every stat in its own sortable columns.</p>`;
  } else if(plb.bucket==="__sc"){
    minLabel="Min SC plays";
    const rows=PLAYERS.filter(p=>p.sc&&pass(p)&&p.sc.sc_plays>=plb.min).map(p=>({...p.sc,team:p.team,player:p.player,role:p.role}));
    const cols=[nameCell,teamCell,confCell,roleCell,{k:"games",label:"G",fmt:r=>td(f0(r.games)),val:r=>r.games},
      {k:"sc_plays",label:"SC plays",fmt:r=>td(f1(r.sc_plays)),val:r=>r.sc_plays},{k:"sc_points",label:"SC pts",fmt:r=>td(f1(r.sc_points)),val:r=>r.sc_points},
      {k:"sc_assists",label:"SC ast",fmt:r=>td(f0(r.sc_assists)),val:r=>r.sc_assists},{k:"sc_ast_pg",label:"SC ast/G",fmt:r=>td(f2(r.sc_ast_pg)),val:r=>r.sc_ast_pg},{k:"kick_assists",label:"Kick-outs",fmt:r=>td(f0(r.kick_assists)),val:r=>r.kick_assists},{k:"kick_ast_pg",label:"Kick-outs/G",fmt:r=>td(f2(r.kick_ast_pg)),val:r=>r.kick_ast_pg},
      {k:"sc_ast_rate",label:"SC ast rate",fmt:r=>td(fp(r.sc_ast_rate)),val:r=>r.sc_ast_rate},{k:"sc_tov",label:"SC TOV",fmt:r=>td(f1(r.sc_tov)),val:r=>r.sc_tov},
      {k:"sc_tov_rate",label:"SC TOV rate",fmt:r=>td(fp(r.sc_tov_rate)),val:r=>r.sc_tov_rate},{k:"sc_ppp_incl_passing",label:"SC PPP incl. passing",fmt:r=>td(f3(r.sc_ppp_incl_passing)),val:r=>r.sc_ppp_incl_passing},
      {k:"shortroll_assists",label:"Short-roll ast",fmt:r=>td(f0(r.shortroll_assists)),val:r=>r.shortroll_assists},{k:"postup_assists",label:"Post-up ast",fmt:r=>td(f0(r.postup_assists)),val:r=>r.postup_assists},
      {k:"highlow_assists",label:"High-low ast",fmt:r=>td(f0(r.highlow_assists)),val:r=>r.highlow_assists}];
    body=pagedTable(id,cols,rows,{sortK:"sc_ast_pg",dir:-1,maxH:"70vh"});
  } else {
    minLabel="Min plays in bucket";
    const rows=PLAYERS.filter(pass).map(p=>{const r=getRow(p.rows,plb.bucket,plb.sub); return r?{...r,team:p.team,player:p.player,role:p.role}:null;}).filter(r=>r&&r.plays>=plb.min);
    const cols=[nameCell,teamCell,confCell,roleCell,...statCols({})];
    body=pagedTable(id,cols,rows,{sortK:"ppp",dir:-1,maxH:"70vh"})+`<p class="note">Percentiles rank against D-I players with 10+ plays in the bucket; sub-bucket rows have no percentile.</p>`;
  }

  app.innerHTML=`<h1>Player leaderboard</h1><p class="sub">Every D-I player. Pick a play type for its full line (plays, points, frequency and efficiency percentiles vs. D-I, TOV%). Click any column header to sort.</p>
  <div class="controls"><div class="seg" id="bTabs" style="flex-wrap:wrap">${tabs.map(([v,l])=>`<button data-b="${esc(v)}" class="${plb.bucket===v?"on":""}">${esc(l)}</button>`).join("")}</div></div>
  <div class="controls">
   ${subs.length?`<label>Sub-bucket<select id="sSel">${["All",...subs].map(s=>`<option ${plb.sub===s?"selected":""}>${s}</option>`).join("")}</select></label>`:""}
   <label>Conference<select id="cSel">${confOptions(plb.conf)}</select></label>
   <label>Team<select id="tSel"><option value="">All teams</option>${plb.conf?(TEAMS_BY_CONF[plb.conf]||[]).map(t=>`<option value="${esc(t)}" ${plb.team===t?"selected":""}>${esc(shortTeam(t))}</option>`).join(""):teamOptions(plb.team)}</select></label>
   <label>Role<select id="rSel"><option value="">All roles</option>${ROLES.map(r=>`<option ${plb.role===r?"selected":""}>${r}</option>`).join("")}</select></label>
   <label>${minLabel}<input id="mIn" type="number" min="0" step="1" value="${plb.min}" style="width:90px"></label>
   <label>Search<input id="qIn" type="search" value="${esc(plb.q)}" placeholder="Player name"></label>
  </div><div class="card">${body}</div>`;
  const bind=(id,f)=>{const el=document.getElementById(id); if(el) el.onchange=e=>{f(e.target.value); plb.page=0; pagePlayerLB();};};

// ---------------------------------------------------------------- glossary
function pageGlossary(){
  const G=(t,d)=>`<dt>${t}</dt><dd>${d}</dd>`;
  app.innerHTML=`<h1>Glossary</h1><p class="sub">How every number in this dashboard is defined, and where the model can be wrong.</p>
  <div class="grid g2">
  <div class="card gl"><h2>Stats</h2><dl>
   ${G("Play","A possession-ending action, Synergy-style: a field-goal attempt, a turnover, or a free-throw trip. And-one free throws are added to the shot's points. Technical free throws are excluded. An offensive rebound starts a new play.")}
   ${G("Plays / Plays per game (Plays/G)","Number of plays in the bucket, total and per game. Counts can have decimals because missed shots and free-throw trips are split fractionally between buckets (see Limits).")}
   ${G("Points (Pts) / Points per game (Pts/G)","Points scored on those plays, total and per game. Team totals reconcile to actual scoring within about 0.5 points per game (technical FTs only).")}
   ${G("Frequency (Freq)","Bucket plays ÷ all of the team's (or player's) plays, including Transition, Putbacks and Other, so the buckets add to 100%.")}
   ${G("Half-court frequency (HC Freq)","The same share, counting only half-court plays (Transition and Putbacks removed).")}
   ${G("PPP","Points per play: points ÷ plays.")}
   ${G("TOV%","Share of the bucket's plays that ended in a turnover.")}
   ${G("TOV %ile","D-I percentile of TOV%, shaded blue when good for that side. Offense: 100 = turns it over least often. Defense: 100 = forces turnovers most often. Players rank against D-I players with 10+ plays in the bucket. Blank on Turnovers rows and on rows that never contain turnovers (shot sub-buckets such as Pull-Up 3 or Rim, and Putbacks).")}
   ${G("Freq %ile","Percentile of frequency among all D-I teams (players: D-I players with 10+ plays in the bucket). 100 = uses it most often. On offense it describes style, not quality, so it is shaded in a single blue scale. Exception, turnover rows (each bucket's Turnovers sub-row and Other): on offense 100 = turns it over least often, on defense 100 = forces turnovers most often, and both are shaded blue (good) to red (bad) like efficiency. On defense (frequency allowed), the shading follows what is good for the defense, as on the Matchup page: allowing a play type more often is red, allowing it less is blue; the number itself is still 100 = allowed most often.")}
   ${G("Eff. %ile (PPP %ile)","Efficiency percentile: percentile of PPP among all D-I teams (players: D-I players with 10+ plays in the bucket). 100 = most efficient. Shaded blue above the median and red below.")}
   ${G("Defense","Team defense tables describe what opponents did against the team. PPP allowed = opponent points per play. PPP %ile on defense: 100 = fewest points allowed per play. Freq %ile on defense: 100 = opponents run that play type most often against them.")}
   ${G("D-I average","Average across all D-I teams: frequency is the mean team frequency; PPP is total points ÷ total plays across D-I.")}
   ${G("Conf. / D-I PPP rank","On a player page, the player's rank in PPP among players in his conference, and among all D-I players, with 10+ plays in that bucket.")}
   ${G("Conference filters","The team and player leaderboards can be narrowed to one conference. Percentiles still rank against all of D-I. A conference average row (mean of its teams' frequencies; PPP pooled across its teams) is pinned on single-bucket team views.")}
   ${G("Conferences","ESPN's 2026-27 conference alignment, as listed on each team's game data.")}
   ${G("Primary type","The half-court bucket (of the five main buckets) where the player has his highest frequency.")}
   ${G("Game by game","On each team page: the same play-type stats for every game (D-I opponents only), on offense or defense. Compare one play type across games with the bar charts and table, or every play type side by side.")}
   ${G("Games (G)","Games vs. D-I opponents only. Games against non-D-I opponents are dropped.")}
  </dl></div>
  <div class="card gl"><h2>Play-type buckets</h2><dl>
   ${G(`<span class="sw" style="background:${bcol("Self-Creation")}"></span>Self-Creation`,"On-ball creation: pick-and-roll ball handling and isolation together (the data can't separate them). Sub-buckets: <b>Pull-Up 3</b> (unassisted 3s: pull-ups, step-backs and other 3s off the dribble), <b>Mid-Range Dribble Jumper</b> (pull-up and step-back 2s, other unassisted 2pt jumpers, turnarounds/fadeaways outside post range) and <b>Rim</b> (driving layups and floaters, unassisted layups/dunks by guards and wings, assisted drives by guards/wings as catch-and-attack).")}
   ${G(`<span class="sw" style="background:${bcol("Rollers")}"></span>Rollers`,"The screener's finish, credited to Bigs and Stretch Bigs. <b>Roll to Rim</b>: assisted (by a guard or wing) layups, dunks, alley-oops, driving layups and floaters by bigs (also picks up dump-offs in the dunker spot). Rollers now has one sub-bucket; assisted jumpers by bigs (pick-and-pop) count under Off-Ball Shooters. Short-roll passing is tracked in the Self-Creation passing table.")}
   ${G(`<span class="sw" style="background:${bcol("Off-Ball Cutters")}"></span>Off-Ball Cutters`,"<b>Cut</b>: assisted plain layups, dunks and alley-oops by guards and wings.")}
   ${G(`<span class="sw" style="background:${bcol("Off-Ball Shooters")}"></span>Off-Ball Shooters`,"<b>Catch-and-Shoot 3</b>: assisted plain 3s by guards and wings, passed by a guard or wing. <b>Big-Assisted C&S 3</b>: assisted plain 3s passed by a Big or Stretch Big, whoever shoots (kick-outs from the post or the short roll, and big-to-big 3s), a proxy for inside-out play. <b>Big C&S 3</b>: plain 3s taken by a Big or Stretch Big and passed by a guard or wing, a proxy for pick-and-pop. The three don't overlap; add them for all catch-and-shoot 3s. <b>Catch-and-Shoot 2</b>: assisted plain 2pt jumpers by guards and wings, plus assisted 2pt jumpers by bigs from 12+ ft (pops).")}
   ${G(`<span class="sw" style="background:${bcol("Post-Ups")}"></span>Post-Ups`,"<b>Post-Up Scoring</b>: hooks; turnarounds within 12 ft (17 ft for bigs); unassisted plain layups/dunks by bigs; unassisted 2pt jumpers by bigs within 10 ft. <b>High-Low</b>: a plain layup, dunk or alley-oop by a Big or Stretch Big, assisted by another Big or Stretch Big (big-to-big at the rim; these would otherwise be Roll to Rim). High-Low plays are credited to the finishing big; the passer gets High-Low Passing.")}
   ${G("Turnovers","Each bucket's turnovers count in its plays, frequency and TOV% (team and player pages show them in the parent row's TOV% and TOV %ile; the leaderboards show them in the TOV% and TOV %ile columns). Turnovers are allocated by the player's own play mix; On-Ball Guard turnovers all go to Self-Creation; offensive fouls by bigs go to Rollers (moving screens).")}
   ${G(`<span class="sw" style="background:${bcol("Transition")}"></span>Transition`,"Any play within 8 seconds of a live-ball defensive rebound or a steal. Kept so frequencies are accurate; use your own numbers for transition analysis.")}
   ${G(`<span class="sw" style="background:${bcol("Putbacks")}"></span>Putbacks`,"A shot within 4 seconds of the team's own offensive rebound, or any tip-in. Kept so frequencies are accurate.")}
   ${G(`<span class="sw" style="background:${bcol("Other")}"></span>Other`,"Team turnovers not credited to a player. Listed so the frequencies add to 100%.")}
  </dl></div>
  <div class="card gl"><h2>Passing overlays</h2><dl>
   ${G("Self-Creation Passing","Assists on half-court makes by On-Ball Guard or Wing passers. Counted on top of the shooter's bucket.")}
   ${G("High-Low Passing","Assists by a Big or Stretch Big to another Big or Stretch Big's plain layup, dunk or alley-oop. The passer's location isn't in the data, so this is every big-to-big finish at the rim, not only passes from the top of the key.")}
   ${G("Short-Roll Passing","All other assists by Stretch Big passers, and Big passers' assists to any other shot at the rim (e.g. to a cutting guard).")}
   ${G("Post-Up Passing","Big passers' assists to a 3 or a jumper beyond 10 ft. Low confidence: it can't be told apart from short-roll kick-outs.")}
   ${G("Kick-outs (inferred)","Shown in the Self-Creation passing table, not as a play-type sub-bucket. Estimated from play-by-play, which records who assisted a make but not whether a drive came first: a half-court catch-and-shoot 3 by a guard or wing counts as a kick-out when the passer is an On-Ball Guard (roles from the roles sheet for America East, the role files plus stat inference elsewhere), on the assumption that most of those passes come off a downhill drive or a ball screen. <b>Kick-outs / G</b> counts those made 3s; they are already inside Self-Creation assists, so they are never added again. <b>Kick-out PPP</b> (teams) is the efficiency of those 3s, misses included; misses list no passer, so their share is estimated from the shooter's own made 3s. The 3s themselves stay in Off-Ball Shooters / Catch-and-Shoot 3.")}
   ${G("Missed shots in High-Low and Big-Assisted C&S 3","Misses never list a passer. A missed shot's assisted share is split using the shooter's own share of those makes that came from big passers, shrunk toward his role's average (same method as the catch-and-shoot split). That is why these counts have decimals.")}
   ${G("SC assist rate","Self-Creation assists ÷ (Self-Creation plays + Self-Creation assists).")}
   ${G("SC turnover rate","Self-Creation turnovers ÷ (Self-Creation plays + Self-Creation assists). Its team percentile is oriented so 100 is good: on offense 100 = fewest turnovers, on defense 100 = forces the most.")}
   ${G("SC PPP incl. passing","Self-Creation points plus points from Self-Creation assists, per Self-Creation play-or-assist. Runs high because missed shots after a pass can't be seen.")}
   ${G("Short-roll / Post-up ast/G","Short-Roll and Post-Up Passing assists per game.")}
  </dl></div>
  <div class="card gl"><h2>Defensive schemes</h2><dl>
   ${G("What it is","One inferred label per defense, plus a secondary. ESPN play-by-play has no coverage tags (nothing says drop, hedge, zone or pack-line), so the label is read from outcomes: what opponents ran, where they shot and how often they turned it over. Zone and man can't be told apart, so labels describe what a defense does, not how it lines up. Treat it as a lean to confirm on film, especially early in the season.")}
   ${G("Drop","Contains ball screens and lives with what that gives up: lots of Self-Creation and pick-and-pop, mid-range jumpers, few catch-and-shoot looks, few rim attempts or 3s, few turnovers. Covers deep and shallow drop (not separable). Score: +Self-Creation, −Catch-and-shoot, +Mid-range, −Turnovers (¾), +Pick-and-pop (½), −Rim (½), −3PA (½), −Steals (¼). Anchors: Florida, Arizona State, Bryant.")}
   ${G("Hedge / Blitz","Attacks ball screens: hedge, show, blitz or trap (not separable). Its signature is live-ball turnovers by roll men and ball handlers, and it gives up the passes a blitz leaves open: short-roll assists and kick-outs, then catch-and-shoot 3s in rotation. Score: +Steal turnovers (1¼), +Roller turnovers, +Self-Creation turnovers (¾), +All turnovers (¾), +Short-roll assists allowed (¾), −Self-Creation (¾), +Catch-and-shoot (½), +Kick-outs allowed (½), −Off-the-dribble 3PA share (½), +FT trips (½). Anchors: Iowa State, Houston.")}
   ${G("Paint Wall","Pack-line and packed zones: walls off the paint and concedes the 3. Allows few rim attempts, post-ups, roller finishes, cuts and free throws, gives up 3s and catch-and-shoot, and doesn't gamble for steals. Zones also tend to allow high-low passes and offensive rebounds. Score: +3PA (1¾), +Catch-and-shoot (1¼), −Rim, −FT trips, −Post-ups (¾), −Steals (¾), −Roller freq (¾), −Self-Creation (¾), +High-Low allowed (¾), −Roll-to-rim (½), −Cutters (½), +Putbacks allowed (½), −SC assist rate allowed (½). Anchors: South Alabama (2-3 zone), Nebraska.")}
   ${G("Havoc","Pressure and turnover-forcing: denial man, full-court presses, run-and-jump and pressure zones. Forces turnovers and steals, takes away catch-and-shoot, and gives up backdoor cuts, fouls and some rim attempts. Half-court and full-court pressure can't be separated yet. Score: +Steals, +Turnovers, +Cutters (¾), −Catch-and-shoot (¾), +FT trips (½), +Self-Creation turnovers (½), −3PA (½), +Rim (¼). Pressure zones such as St. John's usually land here or in Hedge / Blitz.")}
   ${G("Switch (secondary only)","Experimental. Switching shows up as few roller, roll-to-rim and pick-and-pop finishes, more isolation-style Self-Creation and mismatch post-ups, and fewer short-roll and Self-Creation assists. It is listed only as a secondary, when its score is above 1.0, because the defender on each play isn't in the data. Score: −Roller freq, −Roll-to-rim (¾), −Pick-and-pop (¾), +Self-Creation (¾), +Post-ups (½), −SC assist rate allowed (½), −Short-roll assists allowed (½).")}
   ${G("Mixed","The top score is under 0.75, so the defense doesn't look clearly like any one scheme. The top scheme is still shown as a lean (e.g. Mixed (lean Drop)) when its score is above 0.3.")}
   ${G("Indicators","The first 16 are half-court only, from opponents' plays against the team. Freq = share of opponents' half-court plays in that bucket (Self-Creation; catch-and-shoot = Off-Ball Shooters plays by guards and wings; pick-and-pop = assisted jumpers by bigs; roll-to-rim = Rollers / Roll to Rim; roller = Rollers plus pick-and-pop; Post-Ups; Off-Ball Cutters). Turnover rate forced = share of half-court plays ending in a turnover; steal turnover rate = share ending in a turnover with a steal credited. Roller and Self-Creation turnover rates are the share of those buckets' plays ending in a turnover. Rim rate = share of half-court FGA from 4 ft or less; mid-range = all other 2s; 3PA rate = share of FGA that are 3s; off-the-dribble share = Self-Creation 3s ÷ all 3PA; FT trip rate = FT trips per half-court play. The last 5 are raw allowed rates: High-Low and Putbacks share of all opponent plays, short-roll assists and kick-outs allowed per game, and Self-Creation assist rate allowed.")}
   ${G("Opponent adjustment","The 16 half-court indicators are the rate allowed minus what those opponents do on offense across all their games (weighted by half-court plays in each matchup), so a defense isn't labeled Drop just because it played pick-and-roll-heavy teams. The vs. opp. norm column shows that difference. The 5 raw indicators are not adjusted.")}
   ${G("How a team is assigned","Indicators are z-scored across D-I. Each scheme score is a weighted sum of z-scores (weights above, scaled so the scores are comparable; 0 = D-I average). The primary label is the highest of Drop, Hedge / Blitz, Paint Wall and Havoc, or Mixed when that score is under 0.75. Secondary = the runner-up when its score is above 0.45 and within 1.0 of the top; if there is none, Switch when its score is above 1.0. Confidence (0-100) = D-I percentile of the primary score, scaled down when the runner-up is within 0.5.")}
   ${G("Known blind spots","Zone and man look the same in play-by-play: packed zones read as Paint Wall, but pressure zones (St. John's, Merrimack) read as Havoc or Hedge / Blitz, and some zone teams (UAlbany) come out Mixed. Ice and no-middle coverages, zone shapes and junk defenses (box-and-one, triangle-and-two) are not labeled. Early-season samples (5 to 8 games) move scores a lot. Scorekeeping differences (what gets called a driving layup) move the Self-Creation and rim numbers a little.")}
  </dl></div>
  <div class="card gl"><h2>Matchup page</h2><dl><!--MATCHUP-GLOSS-->
   ${G("What it shows","Pick any two teams. The left column puts Team A's offense against Team B's defense, the right column the reverse. Each card is one play-type bucket: the offense's number and D-I percentile on the left, the defense's on the right.")}
   ${G("Percentile chips","Each chip is the D-I percentile of that number, shaded blue when it is good for that side and red when it is bad. PPP and turnover rate: 100 = best for that side (the offense scores the most or turns it over least; the defense allows the fewest points or forces the most turnovers). Frequency: the number is the plain percentile (100 = most often), but the shading follows what is good for each side: an offense that runs a play type a lot is blue, while a defense that allows it a lot is red and one that denies it is blue. Plays per game is pace only and stays grey.")}
   ${G("Sub-bucket rows","PPP for each sub-bucket, with the share of plays it makes up for the offense (and for the defense's opponents) under each value.")}
   ${G("Expected PPP","Offense PPP + defense PPP allowed − D-I average PPP. A simple additive estimate with no home-court or tempo adjustment.")}
  </dl></div>
  <div class="card gl"><h2>Team archetypes</h2><dl>
   ${G("What it is","One inferred offensive label per team, plus a secondary and a pace tag, read from the play-type mix (frequencies are shares of all offensive plays) and the Self-Creation passing table. Offense is not opponent-adjusted. Screen- and alignment-based offenses can't be seen in play-by-play, so flex, swing and blocker-mover fold into Motion, and horns folds into Spread PnR.")}
   ${G("Spread PnR","Ball-screen offense: spread pick-and-roll, 5-out PnR, horns. Score: +Self-Creation, +Rollers, +Roll to Rim (½), +Pull-Up 3 (½), +Short-roll assists (½), +SC assist rate (½), −Cutters (½), −Post-Ups (½). PnR and isolation both live in Self-Creation; Rollers is what separates them.")}
   ${G("Drive & Kick","Dribble-drive and attack-and-kick: drives to the rim and kick-outs to shooters, few ball screens. Score: +Self-Creation Rim, +Kick-outs / G, +Catch-and-Shoot 3 (¾), −Rollers (¾), −Post-Ups (½), −Mid-Range Dribble Jumpers (½).")}
   ${G("Motion / Read & React","Ball and player movement more than one creator: motion, blocker-mover, swing, flex. Score: +Catch-and-Shoot 3, +Catch-and-Shoot 2 (¾), +Cutters (½), −Self-Creation, −Kick-outs / G (¼).")}
   ${G("Princeton / Cut & Pass","Backdoor cuts and a passing big at the high post: Princeton and high-post hub offenses. Score: +Cutters, +Big-Assisted C&S 3 (¾), +Post-up assists / G (¾), +Big C&S 3 (½), −Self-Creation (¾), −Transition (½).")}
   ${G("5-Out Pace & Space","Five shooters and a stretch 5. Score: +3PA share (all 3-point sub-buckets), +Big C&S 3, +Transition (½), −Post-Ups, −Roll to Rim (½), −Mid-Range Dribble Jumpers (½).")}
   ${G("Inside-Out / Post","Post-centric, inside-out and high-low offenses. Score: +Post-Ups, +High-Low (¾), +Post-Up Scoring (½), +High-low assists / G (½), −Pull-Up 3 (½), −3PA share (½).")}
   ${G("Pace tag","+ Pace when the team's Transition frequency is at least 1 SD above the D-I mean, Slow when it is at least 1 SD below. It's a tag, not an archetype, and it measures transition share, not possessions per 40.")}
   ${G("Mixed","The top score is under 0.75, so the offense doesn't look clearly like any one archetype. The top archetype is still shown as a lean when its score is above 0.3.")}
   ${G("How a team is assigned","Each metric is z-scored across D-I. Each archetype score is a weighted sum of z-scores (scaled so the six scores are comparable; 0 = D-I average). Primary = the highest score, or Mixed under 0.75. Secondary = the runner-up when its score is above 0.45 and within 1.0 of the top. Confidence (0-100) = D-I percentile of the primary score, scaled down when the runner-up is within 0.5. The team page shows every score and the fingerprint metrics behind it.")}
  </dl>
  <h2 style="margin-top:18px">Player roles</h2><dl>
   ${G("On-Ball Guard, Wing, Stretch Big, Big","Every player has one of the four roles. Where it came from is shown on his player page and when you hover the Role cell in the player leaderboard.")}
   ${G("America East players: Tanner's sheet","America East roles come only from your Google Sheet. None of the uploaded files change them, and the numbers for AE players' roles match the America East dashboard.")}
   ${G("Everyone else: three files combined","For the rest of D-I, the three uploaded files are combined with the stat model into one call per player:")}
   ${G("Positional list (about 500 players)","Its 8-way label and height set the role. Pure PG → On-Ball Guard. Scoring PG → On-Ball Guard (6'7\" and up → Wing). Combo G → On-Ball Guard if the ratings file's creator scale is 2.3 or lower, Wing if it is 3.5 or higher; otherwise his stats or a 30%+ Lead Playmaker archetype make him an On-Ball Guard. Wing G → Wing, unless his creator scale is 1.8 or lower, his assist ratio is 25%+, or his archetype mix is 40%+ Lead Playmaker (then On-Ball Guard). Wing F → Wing (6'9\" and up → Big, or Stretch Big if 30%+ of his shots are 3s). Stretch 4 → Stretch Big (Big if under 30% 3PA; Wing at 6'6\" or shorter). PF/C → Big (Stretch Big at 35%+ 3PA on 8+ attempts). C → Big (Stretch Big at 40%+ 3PA on 8+ attempts).")}
   ${G("Archetype list","Decides the few top-100 players missing from the positional list: a C → Big, an F → Big when 40%+ of his mix is paint/interior archetypes (otherwise Wing), a G → On-Ball Guard when 35%+ is Lead Playmaker + Interior Facilitator (otherwise Wing). It also breaks Combo G and Wing G ties above.")}
   ${G("Ratings + stats (about 3,000 players)","Players in the player-ratings file but not the lists above start from the stat-inferred role, then the file adjusts it. A player it rates as a guard (position 2.4 or lower) is never a big. Among guards and wings, a strong creator (creator scale 1.8 or lower) is an On-Ball Guard and a strong receiver (4.0 or higher) is a Wing. Big vs. Stretch Big always comes from his 3-point rate, since the file doesn't measure shooting. These cutoffs were calibrated on your AE sheet: stats alone agree with it 74% of the time, stats + ratings 78%.")}
   ${G("Stat-inferred (about 1,000 players)","Players in none of the files (mostly low-minute players): role inferred from ESPN position, rim/post shot share, offensive rebounds, blocks, 3PA rate, assist ratio, usage and unassisted share.")}
   ${G("Name matching","The files use different team spellings (\"Michigan St.\", \"Miami (Fla.)\", \"Tennessee-Martin\"). Players were matched on name (accents, punctuation and Jr./II/III ignored) plus team, with nickname fallbacks (Cam/Cameron, Josh/Joshua). 595 of 599 list names and 3,626 of 3,643 ratings-file names matched; most of the rest haven't played a D-I game yet.")}
  </dl></div>
  </div>
  <div class="card gl"><h2>How a shot is classified</h2><h3>Context comes first: Putbacks, then Transition. Otherwise:</h3>
  <div class="tw"><table><thead><tr><th>Shot</th><th>Assisted</th><th>Shooter role</th><th>Bucket / sub-bucket</th></tr></thead><tbody>
   ${[["Hook; turnaround ≤12 ft (≤17 ft for bigs)","any","any","Post-Ups"],["Pull-up, step-back, other turnaround/fadeaway","any","any","Self-Creation / Pull-Up 3 or Mid-Range Dribble Jumper"],["Driving layup or floater","no","any","Self-Creation / Rim"],["Driving layup or floater","yes","Big / Stretch Big","Rollers / Roll to Rim"],["Driving layup or floater","yes","Guard / Wing","Self-Creation / Rim (catch-and-attack)"],["Plain layup/dunk, alley-oop","yes, by a Big / Stretch Big","Big / Stretch Big","Post-Ups / High-Low"],["Plain layup/dunk, alley-oop","yes, by a guard / wing","Big / Stretch Big","Rollers / Roll to Rim"],["Plain layup/dunk, alley-oop","yes","Guard / Wing","Off-Ball Cutters"],["Plain layup/dunk","no","Big / Stretch Big","Post-Ups"],["Plain layup/dunk","no","Guard / Wing","Self-Creation / Rim"],["Plain 3","yes, by a guard / wing","Big / Stretch Big","Off-Ball Shooters / Big C&S 3"],["Plain 3","yes, by a guard / wing","Guard / Wing","Off-Ball Shooters / Catch-and-Shoot 3"],["Plain 3","yes, by a Big / Stretch Big","any","Off-Ball Shooters / Big-Assisted C&S 3"],["Plain 2pt jumper","yes","Big (12+ ft)","Off-Ball Shooters / Catch-and-Shoot 2"],["Plain 2pt jumper","yes","Guard / Wing","Off-Ball Shooters / Catch-and-Shoot 2"],["Plain 2pt jumper","no","Big ≤10 ft","Post-Ups"],["Plain 3","no","any","Self-Creation / Pull-Up 3"],["Any plain 2pt jumper","no","other","Self-Creation / Mid-Range Dribble Jumper"]].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div></div>
  <div class="card gl"><h2>Limits</h2><dl>
   ${G("No player tracking","hoopR/ESPN college play-by-play never says pick-and-roll, isolation or cut. Play types are inferred from the shot description, shot distance, whether a make was assisted, and the shooter's role. Descriptions like \"driving\" or \"pullup\" depend on the scorekeeper at each arena.")}
   ${G("Missed shots have no assist","A missed plain 3 could be catch-and-shoot or off the dribble, so misses are split fractionally using the player's assisted rate on makes (shrunk toward the D-I average for his role at low volume). This slightly overstates catch-and-shoot misses.")}
   ${G("Fouled misses aren't logged as shots","Free-throw trips and turnovers are allocated by the player's own play mix: 2-shot trips by his 2pt mix, 3-shot trips by his 3pt mix.")}
   ${G("PnR vs. isolation","Can't be separated; both live in Self-Creation.")}
  </dl></div>`;
